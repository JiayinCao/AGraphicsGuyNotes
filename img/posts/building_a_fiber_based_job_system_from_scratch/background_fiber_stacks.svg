  </g>
  <text x="533.3333333333333" y="26" class="lane-title" text-anchor="start">Worker thread 2</text>
  <line x1="533.3333333333333" y1="40" x2="759.9999999999999" y2="40" class="divider" />
  <g transform="translate(533.3333, 40)">
