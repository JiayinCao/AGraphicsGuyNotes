      <line x1="1" y1="340" x2="183.66666666666666" y2="340" class="divider" />
      <text x="92.33333333333333" y="357" class="frame" text-anchor="middle">SwitchToFiber()</text>
      <line x1="1" y1="366" x2="183.66666666666666" y2="366" class="divider" />
      <text x="92.33333333333333" y="383" class="frame" text-anchor="middle">ConvertThreadToFiber()</text>
      <line x1="1" y1="392" x2="183.66666666666666" y2="392" class="divider" />
      <text x="92.33333333333333" y="409" class="frame" text-anchor="middle">InitializeWorker()</text>
