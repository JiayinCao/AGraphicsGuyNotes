<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Fiber-based job system architecture</title>
<desc id="desc">Jobs enter incoming pools. Each worker thread switches through its thread fiber to a background fiber. The scheduler acquires idle or ready job contexts, runs worker fibers, and returns finished contexts to the idle pool. Waiting contexts are tracked by synchronization primitives and become ready when notified. I/O jobs run on a dedicated thread.</desc>
