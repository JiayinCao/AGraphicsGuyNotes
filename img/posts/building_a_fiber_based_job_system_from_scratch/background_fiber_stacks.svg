      <line x1="1" y1="444" x2="183.66666666666666" y2="444" class="divider" />
      <text x="92.33333333333333" y="461" class="frame" text-anchor="middle">main()</text>
      <line x1="1" y1="470" x2="183.66666666666666" y2="470" class="divider" />
      <text x="92.33333333333333" y="487" class="frame" text-anchor="middle">RuntimeEntry()</text>
    </g>
