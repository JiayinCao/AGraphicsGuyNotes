.compact{font-size:22px}
.label{font-size:21px;font-weight:400;paint-order:stroke;stroke:#fafafa;stroke-width:7;stroke-linejoin:round}
.edge{fill:none;stroke:#505862;stroke-width:2;marker-end:url(#arrow);stroke-linejoin:round}
.boundary{fill:none;stroke:#66717e;stroke-width:2;stroke-dasharray:10 7}
rect{stroke-width:1.8}
.pool{fill:#f1f3f5;stroke:#66717e}.thread{fill:#d5e1ee;stroke:#426da7}.fiber{fill:#d6e8e2;stroke:#367e73}.job{fill:#f3e7cb;stroke:#946523}.context{fill:#eae4f2;stroke:#7351a0}.sync{fill:#f1e4e8;stroke:#a44d63}
</style>
